# ===================================================================
# CampusQueue Spring Boot Configuration
# ===================================================================

# Server Configuration
server.port=${PORT:8081}
server.servlet.context-path=/

# Application Information
spring.application.name=campusqueue-backend

# ===================================================================
# PostgreSQL Database Configuration
# Uses environment variables with safe local defaults
# ===================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:campusqueue}
spring.datasource.username=${DB_USERNAME:campusqueue}
spring.datasource.password=${DB_PASSWORD:campusqueue}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Automatically creates/updates tables based on entity definitions
spring.jpa.hibernate.ddl-auto=update
# Display SQL statements in the console (helpful for learning and debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# Jackson JSON Serialization
# ===================================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
